# Every Linux box on the tailnet, reached by Tailscale IP (`tailscale status`).
#   ansible-playbook -i tailscale.ini tailscale-upgrade.yml

[k8s]
k8s-cp    ansible_host=100.75.249.95
# k8s-w1    ansible_host=100.74.81.19
k8s-w2    ansible_host=100.72.148.65
k8s-w3    ansible_host=100.95.19.65

[homelab]
pixie     ansible_host=100.96.100.101
postgres  ansible_host=100.80.115.89
pve  ansible_host=100.106.79.65  ansible_user=root

[tailscale:children]
k8s
homelab

[tailscale:vars]
ansible_user=ubuntu
ansible_python_interpreter=auto_silent
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
