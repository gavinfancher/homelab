# Installed to /etc/systemd/system/caddy.service.d/cloudflare.conf by caddy/deploy.sh.
# Gives Caddy CF_API_TOKEN. The token lives in a root-only file (written by
# caddy/set-token.sh), not in this drop-in, because drop-ins are world-readable.
# systemd reads it as root before starting Caddy as the caddy user.
[Service]
EnvironmentFile=/etc/caddy/cloudflare.env
